name: image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image tag follows the chart's appVersion so the chart's default image.tag resolves.
      - id: version
        run: echo "dsh=$(yq '.appVersion' helm/dsh/Chart.yaml)" >> "$GITHUB_OUTPUT"

      # arm64 is emulated, so pull requests build amd64 only to stay fast.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: DSH_VERSION=${{ steps.version.outputs.dsh }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/dsh:${{ steps.version.outputs.dsh }}
            ghcr.io/${{ github.repository_owner }}/dsh:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create tags and GitHub Releases
      packages: write
    steps:
      - uses: actions/checkout@v4

      - run: helm lint --strict helm/dsh && helm package helm/dsh

      - name: Unit tests
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.0.3 --verify=false
          helm unittest helm/dsh

      # Render the chart with default and feature-rich values and validate the manifests against the Kubernetes schemas.
      - name: Validate rendered manifests
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          helm template dsh helm/dsh | ./kubeconform -strict -summary
          helm template dsh helm/dsh \
            --set ingress.enabled=true --set persistence.enabled=false \
            --set-string podAnnotations.example=true --set-string podLabels.example=true \
            --set 'extraVolumes[0].name=extra' --set 'extraVolumes[0].emptyDir.medium=Memory' \
            --set 'extraVolumeMounts[0].name=extra' --set 'extraVolumeMounts[0].mountPath=/extra' \
            | ./kubeconform -strict -summary

      # A chart change must raise Chart.yaml version, or the push on main would overwrite the published chart.
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch -q --depth=1 origin "$BASE_REF"
          git diff --quiet FETCH_HEAD -- helm/dsh && exit 0
          base=$(git show FETCH_HEAD:helm/dsh/Chart.yaml | yq '.version')
          head=$(yq '.version' helm/dsh/Chart.yaml)
          newest=$(printf '%s\n%s\n' "$base" "$head" | sort -V | tail -1)
          if [ "$base" = "$head" ] || [ "$newest" != "$head" ]; then
            echo "::error file=helm/dsh/Chart.yaml::helm/dsh changed, so raise version above $base (now $head)"
            exit 1
          fi

      # Guard for direct pushes to main: never overwrite a published version.
      - if: github.event_name != 'pull_request'
        env:
          CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          version=$(yq '.version' helm/dsh/Chart.yaml)
          if helm show chart "$CHART_REPO/dsh" --version "$version" >/dev/null 2>&1; then
            echo "::notice::chart $version is already published; skipping push"
            exit 0
          fi
          # GHCR can 404 the just-pushed manifest when helm tags it; the retry reuses the uploaded blobs.
          for i in 1 2 3; do
            helm push dsh-*.tgz "$CHART_REPO" && exit 0
            sleep $((i * 5))
          done
          exit 1

      # One GitHub Release per chart version, tagged dsh-<version>, with generated notes and the packaged chart.
      - if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(yq '.version' helm/dsh/Chart.yaml)
          app=$(yq '.appVersion' helm/dsh/Chart.yaml)
          tag="dsh-$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::release $tag already exists; skipping"
            exit 0
          fi
          notes=$(printf 'Chart `%s` · dsh `%s`\n\n```sh\nhelm install dsh oci://ghcr.io/%s/charts/dsh --version %s\n```\n' \
            "$version" "$app" "${{ github.repository_owner }}" "$version")
          gh release create "$tag" dsh-*.tgz --target "$GITHUB_SHA" --title "dsh chart $version" \
            --notes "$notes" --generate-notes
