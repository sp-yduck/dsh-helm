name: image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image tag follows the chart's appVersion so the chart's default image.tag resolves.
      - id: version
        run: echo "dsh=$(yq '.appVersion' helm/dsh/Chart.yaml)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: DSH_VERSION=${{ steps.version.outputs.dsh }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/dsh:${{ steps.version.outputs.dsh }}
            ghcr.io/${{ github.repository_owner }}/dsh:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: helm lint helm/dsh && helm package helm/dsh

      # A chart change must raise Chart.yaml version, or the push on main would overwrite the published chart.
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch -q --depth=1 origin "$BASE_REF"
          git diff --quiet FETCH_HEAD -- helm/dsh && exit 0
          base=$(git show FETCH_HEAD:helm/dsh/Chart.yaml | yq '.version')
          head=$(yq '.version' helm/dsh/Chart.yaml)
          newest=$(printf '%s\n%s\n' "$base" "$head" | sort -V | tail -1)
          if [ "$base" = "$head" ] || [ "$newest" != "$head" ]; then
            echo "::error file=helm/dsh/Chart.yaml::helm/dsh changed, so raise version above $base (now $head)"
            exit 1
          fi

      # Guard for direct pushes to main: never overwrite a published version.
      - if: github.event_name != 'pull_request'
        env:
          CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          version=$(yq '.version' helm/dsh/Chart.yaml)
          if helm show chart "$CHART_REPO/dsh" --version "$version" >/dev/null 2>&1; then
            echo "::notice::chart $version is already published; skipping push"
            exit 0
          fi
          helm push dsh-*.tgz "$CHART_REPO"
