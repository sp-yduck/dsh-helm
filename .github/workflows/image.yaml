name: image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image tag follows the chart's appVersion so the chart's default image.tag resolves.
      - id: version
        run: echo "dsh=$(yq '.appVersion' helm/dsh/Chart.yaml)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: DSH_VERSION=${{ steps.version.outputs.dsh }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/dsh:${{ steps.version.outputs.dsh }}
            ghcr.io/${{ github.repository_owner }}/dsh:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: helm lint helm/dsh && helm package helm/dsh

      # Tag is the chart's version; pushing an unchanged version overwrites it.
      - if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dsh-*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"
