{{- if .Values.tailscale.enabled }}
{{- if not .Values.tailscale.tailnet }}
{{- fail "tailscale.tailnet is required (your tailnet DNS name, e.g. tail1234.ts.net) so that dsh can trust the Tailscale host" }}
{{- end }}
# Served by the Tailscale Kubernetes operator: HTTPS on https://<hostname>.<tailnet>/ inside your tailnet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dsh.fullname" . }}-tailscale
  labels: {{- include "dsh.labels" . | nindent 4 }}
  {{- if or .Values.tailscale.funnel .Values.tailscale.proxyGroup .Values.tailscale.annotations }}
  annotations:
    {{- if .Values.tailscale.funnel }}
    tailscale.com/funnel: "true"
    {{- end }}
    {{- with .Values.tailscale.proxyGroup }}
    tailscale.com/proxy-group: {{ . | quote }}
    {{- end }}
    {{- with .Values.tailscale.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - {{ .Values.tailscale.hostname | quote }}
  defaultBackend:
    service:
      name: {{ include "dsh.fullname" . }}
      port:
        name: http
{{- end }}
