{{- if .Values.cloudflared.enabled }}
{{- if not .Values.cloudflared.tunnelToken.existingSecret }}
{{- fail "cloudflared.tunnelToken.existingSecret is required: create a Secret with the remotely-managed tunnel token" }}
{{- end }}
# Connects a remotely-managed Cloudflare Tunnel. In the Cloudflare dashboard, route each public
# hostname to http://{{ include "dsh.fullname" . }}.{{ .Release.Namespace }}.svc:{{ .Values.service.port }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dsh.fullname" . }}-cloudflared
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-cloudflared
    app.kubernetes.io/instance: {{ .Release.Name }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
spec:
  replicas: {{ .Values.cloudflared.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-cloudflared
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-cloudflared
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: "{{ .Values.cloudflared.image.repository }}:{{ .Values.cloudflared.image.tag }}"
          args: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudflared.tunnelToken.existingSecret }}
                  key: {{ .Values.cloudflared.tunnelToken.key }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
          {{- with .Values.cloudflared.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
